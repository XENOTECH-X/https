<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Launcher</title>
<style>
html,body{margin:0;background:#000;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
button{background:transparent;color:#0f0;border:1px solid rgba(0,255,0,0.4);font-family:monospace;font-size:14px;padding:12px 28px;letter-spacing:3px;cursor:pointer;}
button:hover{background:rgba(0,255,0,0.1);border-color:#0f0;}
#status{color:#0a0;font-family:monospace;font-size:11px;letter-spacing:2px;min-height:14px;}
</style>
</head>
<body>
<button id="launch">[ CLICK ]</button>
<div id="status"></div>
<script>
const targetURL = "https://selenite.cc/resources/semag/buckshot-roulette/index.html";
const statusEl = document.getElementById("status");

document.getElementById("launch").addEventListener("click", async () => {
  // Open the tab synchronously (inside the click) so the popup blocker allows it,
  // then point it at the blob once the fetch finishes.
  const tab = window.open("", "_blank");
  if (!tab) { statusEl.textContent = "POPUP BLOCKED"; return; }
  tab.document.write('<body style="background:#000;color:#0f0;font-family:monospace;letter-spacing:2px">FETCHING...</body>');

  try {
    statusEl.textContent = "FETCHING...";
    const res = await fetch(targetURL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    let html = await res.text();

    // <base> makes the page's relative scripts/assets resolve against the original site
    const base = '<base href="' + targetURL + '">';
    html = /<head[^>]*>/i.test(html)
      ? html.replace(/<head[^>]*>/i, m => m + base)
      : base + html;

    // Second blob: the fetched page itself, rendered directly (no iframe)
    const blobURL = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    tab.location.replace(blobURL);
    statusEl.textContent = "LOADED";
  } catch (e) {
    tab.close();
    statusEl.textContent = "FETCH FAILED: " + e.message;
  }
});
</script>
</body>
</html>
