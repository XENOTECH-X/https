<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Loading...</title>
<style>html,body{margin:0;background:#000;height:100%;}</style>
</head>
<body>
<script>
// The page that will live at the blob URL: same iframe launch as Data OS browsing mode
const targetURL = "https://www.gamesflare.org/games/indie/2025-2/buckshot-roulette/";

const pageHTML = `<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Browser</title>
<style>
html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;}
iframe{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;border:none!important;z-index:3;}
</style>
</head>
<body>
<script>
const iframe = document.createElement("iframe");
iframe.src = ${JSON.stringify(targetURL)};
iframe.addEventListener("load", () => {
  try { console.log("Page loaded: " + iframe.contentWindow.location.href); }
  catch (e) { console.log("Page loaded (cross-origin)"); }
});
document.body.appendChild(iframe);
<\/script>
</body>
</html>`;

// On load: wrap it in a Blob and navigate to the blob URL
window.addEventListener("load", () => {
  const blob = new Blob([pageHTML], { type: "text/html" });
  const blobURL = URL.createObjectURL(blob);
  location.replace(blobURL);
});
</script>
</body>
</html>
