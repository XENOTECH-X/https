<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Loading...</title>
<style>html,body{margin:0;background:#000;height:100%;}</style>
</head>
<body>
<script>
const targetURL = "https://selenite.cc/resources/semag/buckshot-roulette/index.html";

// Page that lives at the blob URL: iframes the site again
const pageHTML = `<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Browser</title>
<style>
html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;}
iframe{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;border:none!important;z-index:3;}
</style>
</head>
<body>
<script>
const iframe = document.createElement("iframe");
iframe.src = ${JSON.stringify(targetURL)};
iframe.addEventListener("load", () => {
  try { console.log("Page loaded: " + iframe.contentWindow.location.href); }
  catch (e) { console.log("Page loaded (cross-origin)"); }
});
document.body.appendChild(iframe);
<\/script>
</body>
</html>`;

// Immediately on load: build the blob and go to its URL
const blobURL = URL.createObjectURL(new Blob([pageHTML], { type: "text/html" }));
location.replace(blobURL);
</script>
</body>
</html>
