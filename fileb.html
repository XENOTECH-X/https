<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>File B</title>
<style>
html,body{margin:0;background:#000;height:100%;display:flex;align-items:center;justify-content:center;}
button{background:transparent;color:#0f0;border:1px solid rgba(0,255,0,0.4);font-family:monospace;font-size:14px;padding:12px 28px;letter-spacing:3px;cursor:pointer;}
button:hover{background:rgba(0,255,0,0.1);border-color:#0f0;}
</style>
</head>
<body>
<button id="load">[ LOAD ]</button>
<script>
// File C (contents of filec.html) embedded, so the blob IS file C, not a page that loads it
const FILE_C = "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>File C<\/title>\n<style>\nhtml,body{margin:0;background:#000;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;}\nbutton{background:transparent;color:#0f0;border:1px solid rgba(0,255,0,0.4);font-family:monospace;font-size:14px;padding:12px 28px;letter-spacing:3px;cursor:pointer;}\nbutton:hover{background:rgba(0,255,0,0.1);border-color:#0f0;}\niframe{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;border:none!important;z-index:3;}\n<\/style>\n<\/head>\n<body>\n<button id=\"load\">[ LOAD ]<\/button>\n<script>\nconst targetURL = \"https://badparentingame.io/play/buckshot-roulette\";\n\n// Click -> load the game in an iframe (same launch as Data OS showURLMode)\ndocument.getElementById(\"load\").addEventListener(\"click\", () => {\n  document.getElementById(\"load\").remove();\n  const iframe = document.createElement(\"iframe\");\n  iframe.src = targetURL;\n  iframe.addEventListener(\"load\", () => {\n    try { console.log(\"Page loaded: \" + iframe.contentWindow.location.href); }\n    catch (e) { console.log(\"Page loaded (cross-origin)\"); }\n  });\n  document.body.appendChild(iframe);\n});\n<\/script>\n<\/body>\n<\/html>\n";

// LOAD -> open File C directly as a blob URL in a new tab
document.getElementById("load").addEventListener("click", () => {
  const blobURL = URL.createObjectURL(new Blob([FILE_C], { type: "text/html" }));
  window.open(blobURL, "_blank");
});
</script>
</body>
</html>
